{% extends "base.html" %}{% block title %}Download{% endblock %}
{% block content %}
<div class="card narrow">
  <h1>Download a file</h1>
  {% if lockout %}
    <div class="msg error">Too many invalid codes from your address. Try again in {{ lockout }} seconds.</div>
  {% endif %}
  <form method="post">{% csrf_token %}
    {% include "partials/form.html" %}
    <button class="btn primary" type="submit"{% if lockout %} disabled{% endif %}>Find file</button>
  </form>
</div>
{% endblock %}
